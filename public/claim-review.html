<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMRC - Review Claim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { dmrcBlue: '#002B7F', dmrcRed: '#E31D23', bgLight: '#F8FAFC' } } } }
    </script>
</head>

<body class="bg-bgLight text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-100 h-16 flex items-center justify-between px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 flex items-center justify-center shrink-0">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Delhi_Metro_logo.svg/500px-Delhi_Metro_logo.svg.png" alt="DMRC Logo" class="w-full h-full object-contain">
            </div>
            <span class="text-dmrcBlue font-black text-xl tracking-wider ml-1">DMRC</span>
            <span class="text-gray-300 mx-2">|</span>
            <span class="text-xs font-bold text-dmrcBlue uppercase tracking-wide">Claim Review</span>
        </div>
        <a href="hr-dashboard.html" class="text-xs font-bold text-gray-500 hover:text-dmrcBlue flex items-center gap-1.5"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-8 grid grid-cols-1 lg:grid-cols-3 gap-6 items-start" id="content">
        <p class="text-sm text-gray-400 lg:col-span-3">Loading claim...</p>
    </main>

    <footer class="bg-white border-t border-gray-100 text-center py-3 text-[10px] font-semibold text-gray-400 tracking-wide">
        Powered by <span class="text-dmrcBlue font-bold">DMRC</span> <span class="text-gray-300 mx-1">|</span> Version 1.0.0 — Prototype
    </footer>

    <script src="js/api.js"></script>
    <script>
        const session = requireRole('hr');
        const claimId = new URLSearchParams(window.location.search).get('id');

        async function load() {
            if (!session || !claimId) return;
            const data = await apiGet(`/claims/${claimId}`);
            render(data);
        }

        function render(data) {
            const { claim, bills, remarks, attachments, employee, dependents } = data;

            const billsRows = bills.map(b => `
                <tr>
                    <td class="py-2 px-2">${b.line_no}</td>
                    <td class="py-2 px-2">${b.name_of_hospital}<br><span class="text-[10px] text-gray-400">${b.hospital_status}</span></td>
                    <td class="py-2 px-2">${b.bill_treatment_type}<br><span class="text-[10px] text-gray-400">${b.description_of_expense || ''}</span></td>
                    <td class="py-2 px-2">${b.bill_number}</td>
                    <td class="py-2 px-2">${fmtDate(b.bill_date)}</td>
                    <td class="py-2 px-2 text-right">₹${fmtCurrency(b.deductions)}</td>
                    <td class="py-2 px-2 text-right font-bold">₹${fmtCurrency(b.requested_amount)}</td>
                </tr>`).join('') || '<tr><td colspan="7" class="py-6 text-center text-gray-400 italic">No bill line items</td></tr>';

            const attachmentsHtml = attachments.length ? attachments.map(a => `
                <a href="${a.file_path}" target="_blank" class="flex items-center gap-2 text-xs font-semibold text-blue-700 hover:underline bg-blue-50 rounded-lg px-3 py-2">
                    <i class="fa-solid fa-file-pdf"></i> ${a.file_name} <span class="text-gray-400 font-normal">(${a.attachment_size})</span>
                </a>`).join('') : '<p class="text-xs text-gray-400 italic">No documents attached to this claim.</p>';

            const remarksHtml = remarks.slice().reverse().map(r => `
                <div class="flex gap-3">
                    <div class="w-2 h-2 rounded-full bg-dmrcBlue mt-1.5 shrink-0"></div>
                    <div>
                        <p class="text-xs font-bold text-gray-700">${r.current_status} <span class="text-gray-400 font-medium">by ${r.user_name} (${r.user_type})</span></p>
                        <p class="text-[11px] text-gray-400">${fmtDate(r.date)} ${r.time || ''}</p>
                        ${r.remarks ? `<p class="text-xs text-gray-600 mt-1 bg-gray-50 rounded-lg p-2">${r.remarks}</p>` : ''}
                    </div>
                </div>`).join('');

            const dependentsHtml = dependents.map(d => `
                <div class="flex justify-between text-xs py-1 border-b border-gray-50 last:border-0">
                    <span class="text-gray-500">${d.relationship}</span><span class="font-bold">${d.name}</span>
                </div>`).join('');

            document.getElementById('content').innerHTML = `
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm space-y-4">
                        <div class="flex items-start justify-between">
                            <div>
                                <h1 class="text-lg font-black text-gray-900">${claim.claim_id}</h1>
                                <p class="text-xs text-gray-400 mt-0.5">Submitted ${fmtDate(claim.submitted_date)} by ${employee.name} (${employee.employee_id})</p>
                            </div>
                            <span class="status-pill ${statusClass(claim.status)}">${claim.status}</span>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 text-xs pt-3 border-t border-gray-50">
                            <div><p class="text-gray-400 font-bold uppercase text-[10px]">Reimbursement Type</p><p class="font-semibold mt-0.5">${claim.reimbursement_type}</p></div>
                            <div><p class="text-gray-400 font-bold uppercase text-[10px]">Request Type</p><p class="font-semibold mt-0.5">${claim.request_type}</p></div>
                            <div><p class="text-gray-400 font-bold uppercase text-[10px]">Disease</p><p class="font-semibold mt-0.5">${claim.disease}</p></div>
                            <div><p class="text-gray-400 font-bold uppercase text-[10px]">Outstation Treatment</p><p class="font-semibold mt-0.5">${claim.outstation_treatment}</p></div>
                            <div><p class="text-gray-400 font-bold uppercase text-[10px]">Request For</p><p class="font-semibold mt-0.5">${claim.request_for}</p></div>
                            <div><p class="text-gray-400 font-bold uppercase text-[10px]">Requested Amount</p><p class="font-semibold mt-0.5">₹${fmtCurrency(claim.requested_amount)}</p></div>
                            <div><p class="text-gray-400 font-bold uppercase text-[10px]">Room Entitlement</p><p class="font-semibold mt-0.5">${claim.room_entitlement}</p></div>
                            <div><p class="text-gray-400 font-bold uppercase text-[10px]">Pay Scale</p><p class="font-semibold mt-0.5">${claim.pay_scale}</p></div>
                            <div><p class="text-gray-400 font-bold uppercase text-[10px]">Mobile / Email</p><p class="font-semibold mt-0.5">${claim.mobile}<br>${claim.email}</p></div>
                        </div>
                        ${claim.comments ? `<div class="text-xs bg-gray-50 rounded-lg p-3"><p class="text-gray-400 font-bold uppercase text-[10px] mb-1">Employee Comments</p>${claim.comments}</div>` : ''}
                    </div>

                    <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm">
                        <h2 class="font-black text-sm text-gray-900 uppercase tracking-wide mb-3">Bill Line Items</h2>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead><tr class="text-gray-400 border-b border-gray-100 uppercase font-bold tracking-wider text-[10px]">
                                    <th class="py-2 px-2">#</th><th class="py-2 px-2">Hospital</th><th class="py-2 px-2">Type</th><th class="py-2 px-2">Bill No.</th><th class="py-2 px-2">Bill Date</th><th class="py-2 px-2 text-right">Deductions</th><th class="py-2 px-2 text-right">Requested</th>
                                </tr></thead>
                                <tbody class="divide-y divide-gray-50">${billsRows}</tbody>
                            </table>
                        </div>
                    </div>

                    <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm">
                        <h2 class="font-black text-sm text-gray-900 uppercase tracking-wide mb-3">Attached Documents</h2>
                        <div class="grid sm:grid-cols-2 gap-2">${attachmentsHtml}</div>
                    </div>

                    <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm">
                        <h2 class="font-black text-sm text-gray-900 uppercase tracking-wide mb-3">Status Timeline</h2>
                        <div class="space-y-3">${remarksHtml}</div>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="bg-white border border-gray-100 rounded-2xl p-5 shadow-sm space-y-2">
                        <h2 class="font-black text-sm text-gray-900 uppercase tracking-wide mb-2">Dependents on Record</h2>
                        ${dependentsHtml}
                    </div>

                    <div class="bg-white border border-gray-100 rounded-2xl p-5 shadow-sm space-y-4">
                        <h2 class="font-black text-sm text-gray-900 uppercase tracking-wide">Process Claim</h2>
                        <div>
                            <label class="field-label">Admissible Amount (₹)</label>
                            <input id="admissibleAmount" type="number" min="0" step="0.01" class="field-input" value="${claim.admissible_amount || claim.requested_amount}">
                        </div>
                        <div>
                            <label class="field-label">Remarks</label>
                            <textarea id="hrRemarks" rows="3" class="field-input" placeholder="Add a note for the employee / audit trail..."></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-2">
                            <button onclick="updateStatus('Under Review')" class="px-3 py-2.5 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 font-bold text-xs">Mark Under Review</button>
                            <button onclick="updateStatus('Query Raised')" class="px-3 py-2.5 rounded-lg bg-amber-50 text-amber-700 hover:bg-amber-100 font-bold text-xs">Raise Query</button>
                            <button onclick="updateStatus('Approved')" class="px-3 py-2.5 rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-bold text-xs">Approve</button>
                            <button onclick="updateStatus('Rejected')" class="px-3 py-2.5 rounded-lg bg-rose-50 text-rose-700 hover:bg-rose-100 font-bold text-xs">Reject</button>
                            <button onclick="updateStatus('Payment Done')" class="col-span-2 px-3 py-2.5 rounded-lg bg-dmrcBlue text-white hover:bg-blue-900 font-bold text-xs">Mark Payment Done</button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function updateStatus(status) {
            const admissibleAmount = document.getElementById('admissibleAmount').value;
            const remarks = document.getElementById('hrRemarks').value;
            try {
                await apiPut(`/claims/${claimId}/status`, {
                    status, hrId: session.user.hr_id, hrName: session.user.name, remarks, admissibleAmount,
                });
                showToast(`Claim marked as "${status}"`, 'success');
                load();
            } catch (err) {
                showToast(err.error || 'Failed to update claim', 'error');
            }
        }

        load();
    </script>
</body>

</html>
